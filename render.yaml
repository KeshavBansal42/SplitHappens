databases:
  - name: splithappens-db
    databaseName: splithappens
    user: splithappens
    plan: free
    ipAllowList: []

services:
  - type: web
    name: splithappens-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splithappens-db
          property: connectionString
      - key: AUTH_MODE
        value: privy
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ESCROW_ADDRESS
        value: "0xf77bbF1907150F2a633A0748A14Fb3Bb29f7f961"
      - key: WORLD_MODE
        value: mock
      - key: WORLD_ENV
        value: staging
      - key: WORLD_ACTION
        value: verify-human
      - key: WORLD_APP_ID
        sync: false
      - key: WORLD_RP_ID
        sync: false
      - key: WORLD_RP_SIGNING_KEY
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: splithappens-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: API_UPSTREAM
        value: https://splithappens-api.onrender.com
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: VITE_ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: VITE_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: VITE_ESCROW_ADDRESS
        value: "0xf77bbF1907150F2a633A0748A14Fb3Bb29f7f961"
