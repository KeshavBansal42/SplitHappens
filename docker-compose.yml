services:
  postgres:
    image: postgres:16-alpine
    container_name: splithappens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splithappens
      POSTGRES_PASSWORD: splithappens
      POSTGRES_DB: splithappens
    ports:
      - "5432:5432"
    volumes:
      - splithappens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splithappens -d splithappens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  splithappens_pgdata:
